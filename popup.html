<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1c1c1e;
      color: #ffffff;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #0a84ff;
      font-size: 16px;
    }
    label {
      font-size: 12px;
      color: #8e8e93;
      display: block;
      margin-bottom: 6px;
    }
    input[type="password"], textarea {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    textarea {
      height: 70px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #0a84ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:active {
      opacity: 0.8;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h3>AI Web Customizer</h3>
  
  <label for="apiKey">Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="Enter API Key">

  <label for="prompt">What do you want to change?</label>
  <textarea id="prompt" placeholder="e.g. Make the background dark gray and text white"></textarea>

  <button id="applyBtn">Apply Changes</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
