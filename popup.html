<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Customizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #14161a;
            --fg: #f2f2ee;
            --muted: #9aa0a8;
            --panel: #1c1f25;
            --line: #2c3037;
            --btn-bg: #f2f2ee;
            --btn-fg: #14161a;
            --term-bg: #0d0e11;
            --term-fg: #30d158;
        }

        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            width: 320px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        header {
            text-align: center;
            margin-bottom: 0.1rem;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="password"], textarea, select {
            width: 100%;
            padding: 0.65rem 0.8rem;
            font: inherit;
            font-size: 0.85rem;
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            transition: border-color .2s;
        }

        input[type="password"]:focus, textarea:focus, select:focus {
            border-color: var(--fg);
        }

        textarea {
            height: 70px;
            resize: vertical;
        }

        input::placeholder, textarea::placeholder {
            color: var(--muted);
        }

        select option { 
            background: var(--panel); 
            color: var(--fg); 
        }

        .dash-btn {
            display: block;
            width: 100%;
            text-align: center;
            font: inherit;
            font-weight: 600;
            padding: 0.75rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: var(--btn-bg);
            color: var(--btn-fg);
            cursor: pointer;
            transition: transform .15s, opacity .15s;
        }

        .dash-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .dash-btn:active { transform: translateY(0); }

        /* Terminal Display Box */
        .terminal-container {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .terminal-box {
            background: var(--term-bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.72rem;
            color: var(--term-fg);
            height: 95px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.35;
        }

        .terminal-box .log-err { color: #ff453a; }
        .terminal-box .log-info { color: #0a84ff; }
        .terminal-box .log-dim { color: #5e636e; }
    </style>
</head>
<body>

    <header>
        <h1>AI Web Customizer</h1>
    </header>

    <div class="input-group">
        <label for="apiKey">Groq API Key</label>
        <input type="password" id="apiKey" placeholder="Enter API Key">
    </div>

    <div class="input-group">
        <label for="prompt">Style Prompt</label>
        <textarea id="prompt" placeholder="e.g. Make background dark gray, buttons rounded cyan"></textarea>
    </div>

    <button class="dash-btn" id="applyBtn" type="button">Apply Changes</button>

    <div class="terminal-container">
        <label>Backend Terminal</label>
        <div id="terminal" class="terminal-box">> Initialized. Ready for prompt...</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
