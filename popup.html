<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Customizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #14161a;
            --fg: #f2f2ee;
            --muted: #9aa0a8;
            --panel: #1c1f25;
            --line: #2c3037;
            --btn-bg: #f2f2ee;
            --btn-fg: #14161a;
        }

        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            width: 300px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 0.25rem;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="password"], textarea, select {
            width: 100%;
            padding: 0.75rem 0.9rem;
            font: inherit;
            font-size: 0.85rem;
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            transition: border-color .2s;
        }

        input[type="password"]:focus, textarea:focus, select:focus {
            border-color: var(--fg);
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        input::placeholder, textarea::placeholder {
            color: var(--muted);
        }

        select option { 
            background: var(--panel); 
            color: var(--fg); 
        }

        .check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 500;
            cursor: pointer;
        }

        .dash-btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            font: inherit;
            font-weight: 600;
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 10px;
            background: var(--btn-bg);
            color: var(--btn-fg);
            cursor: pointer;
            transition: transform .15s, opacity .15s;
        }

        .dash-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .dash-btn:active { transform: translateY(0); }
        .dash-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

        #status {
            font-size: 0.8rem;
            text-align: center;
            min-height: 1.2rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>AI Web Customizer</h1>
    </header>

    <div class="input-group">
        <label for="apiKey">Groq API Key</label>
        <input type="password" id="apiKey" placeholder="Enter API Key">
    </div>

    <div class="input-group">
        <label for="prompt">Style Prompt</label>
        <textarea id="prompt" placeholder="e.g. Make background dark gray and text white"></textarea>
    </div>

    <div class="input-group">
        <label for="mode">Mode</label>
        <select id="mode">
            <option value="edit">Edit this page (keeps all functions)</option>
            <option value="clone">Clone into new tab (static copy)</option>
        </select>
    </div>

    <label class="check" id="stripRow" style="display:none">
        <input type="checkbox" id="stripStyles"> Remove the site's original styles
    </label>

    <button class="dash-btn" id="applyBtn" type="button">Apply Changes</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
