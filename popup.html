<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1c1c1e;
      color: #ffffff;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #0a84ff;
    }
    label {
      font-size: 12px;
      color: #aeaeb2;
      display: block;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: white;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    button {
      width: 100%;
      background-color: #0a84ff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background-color: #3a3a3c;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #30d158;
    }
  </style>
</head>
<body>
  <h3>AI Web Customizer</h3>
  
  <label for="apiKey">Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="AIzaSy..." />

  <label for="prompt">What do you want to change?</label>
  <textarea id="prompt" rows="3" placeholder="e.g. Make background dark and hide top banner"></textarea>

  <button id="applyBtn">Apply Changes</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
