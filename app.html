<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Customizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #14161a;
            --fg: #f2f2ee;
            --muted: #9aa0a8;
            --panel: #1c1f25;
            --line: #2c3037;
            --btn-bg: #f2f2ee;
            --btn-fg: #14161a;
            --term-bg: #0d0e11;
            --term-fg: #30d158;
            --accent: #0a84ff;
        }

        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #fff;
            color: var(--fg);
            overflow: hidden;
        }

        /* ---------- The website replica ---------- */
        #replica {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
        }

        /* Thin progress bar while the AI works */
        #progress {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 3px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, var(--accent), transparent) no-repeat;
            background-size: 40% 100%;
            animation: slide 1.1s linear infinite;
            transition: opacity .2s;
        }
        body.busy #progress { opacity: 1; }
        @keyframes slide {
            from { background-position: -100% 0; }
            to   { background-position: 200% 0; }
        }

        /* ---------- Floating editor box ---------- */
        #panel {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 10;
            width: min(360px, calc(100vw - 32px));
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
            transition: opacity .18s, transform .18s, visibility .18s;
        }
        body.min #panel {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(14px) scale(.97);
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem 0.2rem;
        }
        h1 {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        .icon-btn {
            width: 28px; height: 28px;
            display: grid; place-items: center;
            font: inherit; font-size: 1.1rem; line-height: 1;
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            cursor: pointer;
        }
        .icon-btn:hover { border-color: var(--fg); }

        .panel-body {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            padding: 0.8rem 1rem 1rem;
        }

        .input-group { display: flex; flex-direction: column; gap: 0.35rem; }

        label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="password"], textarea {
            width: 100%;
            padding: 0.65rem 0.8rem;
            font: inherit;
            font-size: 0.85rem;
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            transition: border-color .2s;
        }
        input[type="password"]:focus, textarea:focus { border-color: var(--fg); }
        textarea { height: 84px; resize: vertical; }
        input::placeholder, textarea::placeholder { color: var(--muted); }

        .dash-btn {
            display: block;
            width: 100%;
            text-align: center;
            font: inherit;
            font-weight: 600;
            padding: 0.75rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: var(--btn-bg);
            color: var(--btn-fg);
            cursor: pointer;
            transition: transform .15s, opacity .15s;
        }
        .dash-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .dash-btn:active { transform: translateY(0); }
        .dash-btn:disabled { opacity: .55; cursor: wait; transform: none; }

        .row { display: flex; gap: 0.5rem; }
        .ghost-btn {
            flex: 1;
            font: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.5rem 0.4rem;
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .ghost-btn:hover:not(:disabled) { border-color: var(--fg); }
        .ghost-btn:disabled { opacity: .4; cursor: default; }
        .ghost-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

        .terminal-container { display: flex; flex-direction: column; gap: 0.3rem; }
        .terminal-box {
            background: var(--term-bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.72rem;
            color: var(--term-fg);
            height: 110px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.35;
        }
        .terminal-box .log-err { color: #ff453a; }
        .terminal-box .log-info { color: #0a84ff; }
        .terminal-box .log-dim { color: #5e636e; }

        /* ---------- Minimized state: floating pill ---------- */
        #pill {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 10;
            display: none;
            align-items: center;
            gap: 0.5rem;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--fg);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0.65rem 1.05rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
        }
        #pill:hover { border-color: var(--fg); }
        body.min #pill { display: inline-flex; }
        .pill-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--term-fg);
        }
        body.busy .pill-dot { background: var(--accent); animation: pulse .9s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .25; } }

        /* ---------- Fatal error screen ---------- */
        #fatal {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            place-items: center;
            padding: 2rem;
            background: var(--bg);
        }
        body.fatal #fatal { display: grid; }
        .fatal-box { max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 0.8rem; }
        .fatal-box h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
        .fatal-box p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="progress"></div>

    <!-- Full replica of the website -->
    <iframe id="replica" title="Website replica"></iframe>

    <div id="fatal">
        <div class="fatal-box">
            <h2>AI Web Customizer</h2>
            <p id="fatalMsg"></p>
        </div>
    </div>

    <!-- Shown when the editor box is minimized -->
    <button id="pill" type="button" title="Open the style editor">
        <span class="pill-dot"></span>
        <span id="pillText">Edit style</span>
    </button>

    <!-- Openable / closable editor box -->
    <aside id="panel" aria-label="Style editor">
        <div class="panel-head">
            <h1>AI Web Customizer</h1>
            <button class="icon-btn" id="minBtn" type="button" title="Minimize">&minus;</button>
        </div>

        <div class="panel-body">
            <div class="input-group">
                <label for="apiKey">Groq API Key</label>
                <input type="password" id="apiKey" placeholder="Enter API Key">
            </div>

            <div class="input-group">
                <label for="prompt">Style Prompt</label>
                <textarea id="prompt" placeholder="e.g. Dark theme with cyan rounded buttons, and add a &quot;GitHub&quot; button that goes to github.com"></textarea>
            </div>

            <button class="dash-btn" id="applyBtn" type="button">Apply Changes</button>

            <div class="row">
                <button class="ghost-btn" id="undoBtn" type="button" disabled>&#8630; Undo</button>
                <button class="ghost-btn" id="redoBtn" type="button" disabled>&#8631; Redo</button>
                <button class="ghost-btn" id="origBtn" type="button" aria-pressed="false" disabled>Show original</button>
            </div>

            <div class="terminal-container">
                <label>Backend Terminal</label>
                <div id="terminal" class="terminal-box">> Initialized. Ready for prompt...</div>
            </div>
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
